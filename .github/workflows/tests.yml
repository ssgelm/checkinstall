name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # Containers reach glibc versions the runner images do not. bullseye is
  # the one that matters: it is the only place the pre-2.33 branch of the
  # stat wrappers gets built for real rather than against a stub header.
  suite:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image:
          - debian:bullseye
          - debian:bookworm
          - debian:trixie
          - debian:sid
          - ubuntu:22.04
          - ubuntu:24.04
    steps:
      - name: install what the suite needs
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get -qq update
          apt-get -qq install -y build-essential gettext file cmake dpkg-dev git
      - uses: actions/checkout@v4
      - name: report the environment
        run: |
          echo "glibc:  $(ldd --version | head -1)"
          echo "gcc:    $(gcc --version | head -1)"
          echo "dpkg:   $(dpkg --version | head -1)"
          echo "kernel: $(uname -r)"
      - name: build
        run: make
      - name: run the suite
        run: tests/run-tests.sh

  # 32-bit x86 userland, no emulation needed. This is where the LFS64
  # wrappers and the explicit *_time64 entry points are compiled in, which
  # is the ground #1054601 was fought over.
  #
  # Not a container: job containers get GitHub's own x86_64 node injected
  # for the JavaScript actions, and a 32-bit container cannot execute it.
  # Check out on the runner and reach into the container instead.
  i386:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build and test in a 32-bit userland
        run: |
          docker run --rm --platform linux/386 \
            -v "$PWD":/src:ro -w /tmp i386/debian:bookworm sh -c '
              set -e
              export DEBIAN_FRONTEND=noninteractive
              apt-get -qq update
              apt-get -qq install -y build-essential gettext file cmake dpkg-dev
              cp -r /src /work && cd /work
              rm -f installwatch/*.o installwatch/*.so installwatch/localdecls.h
              echo "userland: $(getconf LONG_BIT)-bit"
              echo "glibc:    $(ldd --version | head -1)"
              make
              n=$(nm -D --defined-only installwatch/installwatch.so |
                  grep -c "__stat64_time64\|__utimensat64")
              echo "explicit time64 wrappers: $n"
              test "$n" -gt 0
              tests/run-tests.sh
            '

  # Distributions compile with _FILE_OFFSET_BITS=64 and _TIME_BITS=64 on
  # 32-bit. Both rename this library's own definitions, which took the plain
  # symbols away and left the true_* pointers bound to a libc function whose
  # struct layout no longer matched. Translation broke on Debian armhf for
  # years without anything noticing. Build the way a distribution does, on
  # the glibc the buildds run, and check the plain names survived.
  distro-flags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build with a distribution's flags in a 32-bit userland
        run: |
          docker run --rm --platform linux/386 \
            -v "$PWD":/src:ro -w /tmp i386/debian:unstable sh -c '
              set -e
              export DEBIAN_FRONTEND=noninteractive
              apt-get -qq update
              apt-get -qq install -y build-essential gettext file cmake dpkg-dev
              cp -r /src /work && cd /work
              rm -f installwatch/*.o installwatch/*.so installwatch/localdecls.h
              echo "glibc: $(ldd --version | head -1)"
              # what the armhf buildd passes
              make CFLAGS="-D_LARGEFILE_SOURCE -D_FILE_OFFSET_BITS=64 -D_TIME_BITS=64 -g -O2"
              for sym in open openat creat fopen stat lstat fstatat readdir \
                         readlink truncate ftruncate utimensat; do
                nm -D --defined-only installwatch/installwatch.so |
                  grep -qw "$sym" || { echo "wrapper lost to a header rename: $sym"; exit 1; }
              done
              tests/run-tests.sh
            '

  # Architectures no runner provides. Emulated, so slow, and worth it only
  # because armhf is where the 64-bit time transition broke the build once
  # already and s390x is the only big-endian target within reach.
  emulated:
    name: ${{ matrix.platform }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/arm/v7
            image: arm32v7/debian:bookworm
            suite: yes
          - platform: linux/s390x
            image: s390x/debian:bookworm
            suite: no
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - name: build and test under emulation
        run: |
          docker run --rm --platform ${{ matrix.platform }} \
            -v "$PWD":/src:ro -w /tmp ${{ matrix.image }} sh -c '
              set -e
              export DEBIAN_FRONTEND=noninteractive
              apt-get -qq update
              apt-get -qq install -y build-essential gettext file cmake dpkg-dev
              cp -r /src /work && cd /work
              echo "arch: $(uname -m), $(getconf LONG_BIT)-bit"
              echo "glibc: $(ldd --version | head -1)"
              make
              if [ "${{ matrix.suite }}" = yes ]; then tests/run-tests.sh; fi
            '

  # The runner itself, unprivileged, which is how an autopkgtest runs it.
  # arm64 is here to catch anything that assumes x86.
  native:
    name: ${{ matrix.os }} (unprivileged)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
      - name: install what the suite needs
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install -y build-essential gettext file cmake dpkg-dev
      - name: report the environment
        run: |
          echo "glibc:  $(ldd --version | head -1)"
          echo "arch:   $(uname -m)"
          echo "user:   $(id -un)"
      - name: build
        run: make
      - name: run the suite
        run: tests/run-tests.sh

  # installwatch builds without a warning under Debian's flags. Keeping it
  # that way is the only reason the last few real bugs were visible.
  warnings:
    runs-on: ubuntu-latest
    container: debian:sid
    steps:
      - name: install
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get -qq update
          apt-get -qq install -y build-essential gettext file dpkg-dev git
      - uses: actions/checkout@v4
      - name: build with the distribution's flags and refuse any warning
        run: |
          eval "$(dpkg-buildflags --export=sh)"
          make -C installwatch CPPFLAGS="$CPPFLAGS" CFLAGS="$CFLAGS" \
               LDFLAGS="$LDFLAGS" 2>&1 | tee build.log
          if grep -q 'warning:' build.log; then
            echo "::error::the build produced warnings"
            grep 'warning:' build.log
            exit 1
          fi

  # No runner ships a glibc old enough to reach some of the version guards,
  # so compile against a stub localdecls.h that claims one.
  old-glibc-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install
        run: sudo apt-get -qq update && sudo apt-get -qq install -y build-essential
      - name: compile the pre-2.33 branch
        run: |
          mkdir -p stub
          cat > stub/localdecls.h <<'EOF'
          #ifndef __LOCALDECLS_H_
          #define __LOCALDECLS_H_
          #define TRUNCATE_T off_t
          #define READLINKAT_T ssize_t
          #define LIBC_FILE "libc.so.6"
          #define LIBC_VERSION "2.28"
          #define GLIBC_MAJOR 2
          #define GLIBC_MINOR 28
          #endif
          EOF
          gcc -fsyntax-only -Istub -Iinstallwatch -D_GNU_SOURCE \
              installwatch/installwatch.c
